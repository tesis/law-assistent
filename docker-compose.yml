services:
  db:
    # prej: image: postgres:15
    image: pgvector/pgvector:pg15   # ali pgvector/pgvector:pg16 za PG16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
